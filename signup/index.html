<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Sign up</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <div class="container card-glass fade-in">

    <!-- 타이틀 -->
    <h1 class="title neon-text">Sign up</h1>

    <!-- 프로필 이미지 -->
    <div class="profile-wrapper">
      <div id="profileCircle" class="profile-circle glow-hover">
        <img id="profilePreview" class="profile-preview hidden" />
        <span id="profileIcon" class="profile-icon">+</span>
      </div>

      <p id="profileError" class="error-text fixed-height"></p>
      <input id="profileInput" type="file" accept="image/*" hidden />
    </div>

    <!-- 이메일 -->
    <div class="input-group">
      <label for="email">이메일</label>
      <input id="email" type="text" placeholder="example@example.com" class="input-glass" />
      <p id="emailError" class="error-text fixed-height"></p>
    </div>

    <!-- 비밀번호 -->
    <div class="input-group">
      <label for="password">비밀번호</label>
      <input id="password" type="password" class="input-glass" />
      <p id="passwordError" class="error-text fixed-height"></p>
    </div>

    <!-- 비밀번호 확인 -->
    <div class="input-group">
      <label for="passwordCheck">비밀번호 확인</label>
      <input id="passwordCheck" type="password" class="input-glass" />
      <p id="passwordCheckError" class="error-text fixed-height"></p>
    </div>

    <!-- 닉네임 -->
    <div class="input-group">
      <label for="nickname">닉네임</label>
      <input id="nickname" type="text" class="input-glass" />
      <p id="nicknameError" class="error-text fixed-height"></p>
    </div>

    <!-- 회원가입 버튼 -->
    <button id="signupBtn" class="btn signup-btn neon-hover" disabled>회원가입</button>

    <!-- 로그인 이동 -->
    <button id="goLoginBtn" class="link-btn glow-text">
      이미 계정이 있으신가요? 로그인
    </button>

    <!-- 토스트 메시지 -->
    <div id="toast" class="toast hidden">회원가입 실패</div>

  </div>

  <script type="module" src="./script.js"></script>

</body>
</html>
