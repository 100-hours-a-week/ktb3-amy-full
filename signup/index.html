<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="header">
    <button id="backBtn" class="back-btn">←</button> <!-- 뒤로가기 -->
    <h1>아무 말 대잔치</h1>
  </header>

  <section class="signup-box">
    <h2>회원가입</h2>

    <!-- 프로필 사진 업로드 -->
    <div class="profile-area">
      <label for="profileInput" class="profile-label">
        <div id="profilePreview" class="profile-circle">+</div>
      </label>
      <input type="file" id="profileInput" accept="image/*" hidden />
      <small id="profileError" class="error"></small>
    </div>

    <!-- 이메일/비밀번호/닉네임 입력 -->
    <div class="input-area">
      <label for="email">이메일*</label>
      <input type="email" id="email" placeholder="이메일을 입력하세요" />
      <small id="emailError" class="error"></small>

      <label for="password">비밀번호*</label>
      <input type="password" id="password" placeholder="비밀번호를 입력하세요" />
      <small id="passwordError" class="error"></small>

      <label for="passwordConfirm">비밀번호 확인*</label>
      <input type="password" id="passwordConfirm" placeholder="비밀번호를 한 번 더 입력하세요" />
      <small id="passwordConfirmError" class="error"></small>

      <label for="nickname">닉네임*</label>
      <input type="text" id="nickname" placeholder="닉네임을 입력하세요" />
      <small id="nicknameError" class="error"></small>
    </div>

    <button id="signupBtn" class="btn disabled">회원가입</button>
    <button id="loginBtn" class="btn-sub">로그인하러 가기</button>
  </section>

  <script src="./script.js"></script>
</body>
</html>
