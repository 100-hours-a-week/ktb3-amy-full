<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1 class="title">로그인</h1>

  <div class="login-box">

    <div class="input-group">
      <label>이메일</label>
      <input id="email" type="text" placeholder="이메일을 입력해주세요" />
      <p class="error-text" id="emailError"></p>
    </div>

    <div class="input-group">
      <label>비밀번호</label>
      <input id="password" type="password" placeholder="비밀번호를 입력해주세요" />
      <p class="error-text" id="passwordError"></p>
    </div>

    <button id="loginBtn" class="btn">로그인</button>

    <button id="signupBtn" class="link-btn">회원가입</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
