<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Posts</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 헤더 -->
  <header class="header fade-in">
    <h1 class="header-title neon-text">게시글 목록</h1>

    <div class="header-right">
      
      <!-- 프로필 영역 -->
      <div class="profile-area glow-border">
        <img 
          id="headerProfileImg" 
          class="profile-img" 
          src="/images/default-profile.png" 
          alt="profile"
        />

        <!-- 프로필 드롭다운 -->
        <div id="headerDropdown" class="profile-dropdown hidden dropdown-glass">
          <div data-action="edit-profile" class="dropdown-item">회원정보 수정</div>
          <div data-action="edit-password" class="dropdown-item">비밀번호 수정</div>
          <div data-action="logout" class="dropdown-item logout">로그아웃</div>
        </div>
      </div>

      <!-- 글쓰기 버튼 -->
      <button id="createBtn" class="create-btn neon-hover">게시글 작성</button>
    </div>
  </header>

  <!-- 게시글 목록 -->
  <main id="postContainer" class="post-container fade-in"></main>

  <!-- 로딩 메시지 -->
  <div id="loading" class="loading hidden">불러오는 중...</div>

  <!-- 끝 메시지 -->
  <div id="endMessage" class="end-message hidden">더 불러올 게시글이 없습니다</div>

  <!-- 공통 헤더 스크립트 -->
  <script src="/common/header.js"></script>

  <!-- 게시글 목록 스크립트 -->
  <script src="script.js"></script>

</body>
</html>
