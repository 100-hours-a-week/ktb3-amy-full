<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시글 목록</title>

  <!-- 공통 헤더 스타일 -->
  <link rel="stylesheet" href="../common/header.css" />

  <!-- 페이지 스타일 -->
  <link rel="stylesheet" href="/posts/style.css" />
</head>
<body>

  <header class="global-header header-glass">
    <h1 class="logo neon-logo">MoveCrew</h1>

    <div class="profile-area">
      <img 
        id="headerProfileImg"
        class="profile-img profile-glow"
        src="/images/default-profile.png"
        alt="profile"
        draggable="false"
      />

      <div id="headerDropdown" class="profile-dropdown dropdown-glass hidden">
        <div class="dropdown-item" data-action="edit-profile">회원정보 수정</div>
        <div class="dropdown-item" data-action="edit-password">비밀번호 수정</div>
        <div class="dropdown-item logout-item" data-action="logout">로그아웃</div>
      </div>
    </div>
  </header>

  <section class="top-bar fade-in">
    <h1 class="header-title neon-text">게시글 목록</h1>
    <button id="createBtn" class="create-btn neon-hover">게시글 작성</button>
  </section>

  <main id="postContainer" class="post-container fade-in"></main>

  <div id="loading" class="loading hidden">불러오는 중...</div>
  <div id="endMessage" class="end-message hidden">더 불러올 게시글이 없습니다</div>

  <!-- 공통 헤더 스크립트 -->
  <script type="module" src="/common/header.js"></script>

  <!-- 게시글 목록 스크립트 -->
  <script type="module" src="/posts/script.js"></script>

</body>
</html>
