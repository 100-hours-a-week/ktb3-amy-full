<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시글 작성</title>

  <!-- 페이지 전용 CSS -->
  <link rel="stylesheet" href="/makepost/style.css" />
</head>
<body>

  <!-- 상단 헤더 (글래스 스타일) -->
  <header class="header-glass fade-in">
    <h1 class="title neon-text">게시글 작성</h1>
    <button id="backBtn" class="back-btn neon-hover">← 목록</button>
  </header>

  <!-- 메인 작성 폼 -->
  <main class="form-wrapper fade-in">

    <!-- 제목 -->
    <div class="form-group">
      <label class="label">제목</label>
      <input 
        type="text" 
        id="titleInput" 
        maxlength="26"
        placeholder="제목을 입력하세요 (최대 26자)"
        class="input-glass"
      />
      <p id="titleError" class="error hidden">*제목은 최대 26자까지 작성 가능합니다.</p>
    </div>

    <!-- 내용 -->
    <div class="form-group">
      <label class="label">내용</label>
      <textarea 
        id="contentInput" 
        placeholder="게시글 내용을 입력하세요"
        class="textarea-glass"
      ></textarea>
    </div>

    <!-- 이미지 업로드 -->
    <div class="form-group">
      <label class="label">이미지 업로드</label>
      <input 
        type="file" 
        id="imageInput" 
        accept="image/*" 
        class="file-input"
      />

      <!-- 이미지 미리보기 -->
      <img 
        id="previewImage" 
        class="preview hidden preview-glow"
      />
    </div>

    <!-- 등록 버튼 -->
    <button id="submitBtn" class="submit-btn neon-hover" disabled>
      등록하기
    </button>

    <p id="submitError" class="error hidden">
      *제목, 내용을 모두 작성해주세요.
    </p>

  </main>

  <script src="/makepost/script.js"></script>
  <script src="/common/dropdown.js"></script>
</body>
</html>
