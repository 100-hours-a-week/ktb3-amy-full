<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시글 작성</title>

  <!-- 공통 헤더 CSS -->
  <link rel="stylesheet" href="../common/header.css" />

  <!-- 페이지 전용 CSS -->
  <link rel="stylesheet" href="/makepost/style.css" />
</head>
<body>

  <!-- MoveCrew 공통 헤더 -->
  <header class="global-header header-glass">

    <h1 class="logo neon-logo">MoveCrew</h1>

    <div class="profile-area">
      <img 
        id="headerProfileImg" 
        class="profile-img profile-glow" 
        src="/images/default-profile.png"
        alt="profile"
        draggable="false"
      />

      <div id="headerDropdown" class="profile-dropdown dropdown-glass hidden">
        <div class="dropdown-item" data-action="edit-profile">회원정보 수정</div>
        <div class="dropdown-item" data-action="edit-password">비밀번호 수정</div>
        <div class="dropdown-item logout-item" data-action="logout">로그아웃</div>
      </div>
    </div>

  </header>

  <!-- 메인 작성 폼 -->
  <main class="form-wrapper fade-in">

    <!-- 뒤로가기 -->
    <button id="backBtn" class="back-btn neon-hover">← 목록</button>

    <!-- 제목 -->
    <div class="form-group">
      <label class="label">제목</label>
      <input 
        type="text" 
        id="titleInput" 
        maxlength="26"
        placeholder="제목을 입력하세요 (최대 26자)"
        class="input-glass"
      />
      <p id="titleError" class="error hidden">*제목은 최대 26자까지 작성 가능합니다.</p>
    </div>

    <!-- 내용 -->
    <div class="form-group">
      <label class="label">내용</label>
      <textarea 
        id="contentInput" 
        placeholder="게시글 내용을 입력하세요"
        class="textarea-glass"
      ></textarea>
    </div>

    <!-- 이미지 업로드 -->
    <div class="form-group">
      <label class="label">이미지 업로드</label>
      <input 
        type="file" 
        id="imageInput" 
        accept="image/*" 
        class="file-input"
      />

      <img 
        id="previewImage" 
        class="preview hidden preview-glow"
      />
    </div>

    <!-- 등록 버튼 -->
    <button id="submitBtn" class="submit-btn neon-hover" disabled>
      등록하기
    </button>

    <p id="submitError" class="error hidden">
      *제목, 내용을 모두 작성해주세요.
    </p>

  </main>

  <!-- 공통 헤더 스크립트 -->
  <script type="module" src="../common/header.js"></script>

  <!-- 페이지 전용 스크립트 -->
  <script type="module" src="/makepost/script.js"></script>

</body>
</html>
