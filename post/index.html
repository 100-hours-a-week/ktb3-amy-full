<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>게시글 상세</title>

  <!-- 공통 헤더 스타일 -->
  <link rel="stylesheet" href="../common/header.css" />

  <!-- 페이지 CSS -->
  <link rel="stylesheet" href="/post/style.css" />
</head>
<body>

  <!-- MoveCrew 공통 헤더 -->
  <header class="global-header header-glass">

    <h1 class="logo neon-logo">MoveCrew</h1>

    <div class="profile-area">
      <img 
        id="headerProfileImg" 
        class="profile-img profile-glow" 
        src="/images/default-profile.png"
        alt="profile"
        draggable="false"
      />

      <!-- 드롭다운 -->
      <div id="headerDropdown" class="profile-dropdown dropdown-glass hidden">
        <div class="dropdown-item" data-action="edit-profile">회원정보 수정</div>
        <div class="dropdown-item" data-action="edit-password">비밀번호 수정</div>
        <div class="dropdown-item logout-item" data-action="logout">로그아웃</div>
      </div>
    </div>

  </header>


  <!-- 모달 오버레이 -->
  <div id="modalOverlay" class="modal-overlay hidden"></div>

  <!-- 삭제 모달 -->
  <div id="deleteModal" class="modal hidden modal-glass">
      <p class="modal-text">정말 삭제하시겠습니까?</p>
      <div class="modal-btns">
          <button id="modalCancelBtn" class="modal-btn cancel">취소</button>
          <button id="modalConfirmBtn" class="modal-btn delete">삭제</button>
      </div>
  </div>

  <!-- 게시글 상단 (header → div 로 변경) -->
  <div class="post-header fade-in">
    <button id="backBtn" class="back-btn neon-hover">← 목록</button>

    <div class="post-actions">
      <button id="editBtn" class="edit-btn action-btn neon-hover">수정</button>
      <button id="deleteBtn" class="delete-btn action-btn neon-hover">삭제</button>
    </div>
  </div>

  <!-- 게시글 내용 -->
  <main class="post-wrapper fade-in">

    <!-- 제목 -->
    <h2 id="postTitle" class="post-title neon-text"></h2>

    <!-- 내용 -->
    <p id="postContent" class="content"></p>

    <!-- 이미지 -->
    <img 
      id="postImage" 
      class="post-image hidden image-glow"
      alt="post image"
    />

    <!-- 통계 영역 -->
    <div class="stats stats-glass">
      <span>조회수: <span id="viewCount"></span></span>
      <span>좋아요: <span id="likeCount"></span></span>
      <span>댓글: <span id="commentCount"></span></span>
    </div>

    <!-- 좋아요 버튼 -->
    <button id="likeBtn" class="like-btn neon-hover">
      좋아요 👍
    </button>

    <!-- 댓글 영역 -->
    <section class="comment-section">
      <h3 class="comment-title neon-text-small">댓글</h3>

      <!-- 댓글 입력 -->
      <textarea 
        id="commentInput" 
        placeholder="댓글을 입력하세요"
        class="comment-textarea input-glass"
      ></textarea>

      <button 
        id="commentSubmitBtn" 
        class="comment-submit-btn neon-hover" 
        disabled
      >
        댓글 등록
      </button>

      <!-- 댓글 목록 -->
      <ul id="commentList" class="comment-list"></ul>
    </section>

  </main>

  <!-- 공통 헤더 스크립트 -->
  <script type="module" src="/common/header.js"></script>

  <!-- 페이지 스크립트 -->
  <script type="module" src="/post/script.js"></script>

</body>
</html>
