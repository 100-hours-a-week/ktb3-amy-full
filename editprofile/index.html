<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Edit Profile</title>

  <!-- 공통 헤더 스타일 -->
  <link rel="stylesheet" href="/common/header.css" />

  <!-- 페이지 스타일 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MoveCrew 공통 헤더 -->
  <header class="global-header header-glass">

    <h1 class="logo neon-logo">MoveCrew</h1>

    <div class="profile-area">
      <img 
        id="headerProfileImg" 
        class="profile-img profile-glow" 
        src="/assets/profile-default.png"
        alt="profile"
        draggable="false"
      />

      <div id="headerDropdown" class="profile-dropdown dropdown-glass hidden">
        <div class="dropdown-item" data-action="edit-profile">회원정보 수정</div>
        <div class="dropdown-item" data-action="edit-password">비밀번호 수정</div>
        <div class="dropdown-item logout-item" data-action="logout">로그아웃</div>
      </div>
    </div>
  </header>


  <!-- 메인 -->
  <main class="fade-in">

    <!-- 뒤로가기 -->
    <button id="backBtn" class="back-btn">← 뒤로가기</button>

    <h2 class="page-title">프로필 수정</h2>

    <!-- 프로필 이미지 영역 -->
    <div class="profile-wrapper">

      <img id="profileImg" class="profile-img profile-glow" alt="profile image" />

      <!-- 드롭다운 -->
      <div id="profileDropdown" class="dropdown dropdown-glass hidden">
        <div class="dropdown-item" data-value="change">프로필 사진 변경</div>
        <div class="dropdown-item warning" data-value="delete">프로필 사진 삭제</div>
      </div>

      <input id="profileInput" type="file" accept="image/*" class="hidden">
    </div>

    <!-- 닉네임 -->
    <div class="form-group">
      <label class="input-label">닉네임</label>
      <input 
        id="nicknameInput" 
        type="text" 
        placeholder="닉네임을 입력하세요" 
        maxlength="10"
        class="input-field"
      />
      <small id="nicknameError" class="error hidden"></small>
    </div>

    <!-- 수정 버튼 -->
    <button id="updateBtn" class="update-btn" disabled>
      수정하기
    </button>

    <!-- 회원탈퇴 -->
    <button id="deleteAccountBtn" class="delete-btn">
      회원 탈퇴
    </button>

  </main>


  <!-- 회원탈퇴 모달 -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal modal-glass">
      <p class="modal-text">정말 회원탈퇴 하시겠습니까?</p>
      <div class="modal-buttons">
        <button id="cancelDelete" class="modal-cancel">취소</button>
        <button id="confirmDelete" class="modal-confirm">탈퇴</button>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div id="toast" class="toast hidden">수정 완료!</div>

  <!-- 공통 헤더 JS -->
  <script src="/common/header.js"></script>

  <!-- 페이지 JS -->
  <script type="module" src="script.js"></script>

</body>
</html>
