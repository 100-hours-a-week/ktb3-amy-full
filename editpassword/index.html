<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Edit Password</title>

  <!-- 공통 헤더 스타일 -->
  <link rel="stylesheet" href="/common/header.css" />

  <!-- 페이지 자체 스타일 -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- MoveCrew 글로벌 헤더 -->
  <header class="global-header header-glass">

    <h1 class="logo neon-logo">
      MoveCrew
    </h1>

    <div class="profile-area">
      <img 
        id="headerProfileImg" 
        class="profile-img profile-glow" 
        src="/images/default-profile.png"  
        alt="profile"
        draggable="false"
      />

      <div id="headerDropdown" class="profile-dropdown dropdown-glass hidden">
        <div class="dropdown-item" data-action="edit-profile">회원정보 수정</div>
        <div class="dropdown-item" data-action="edit-password">비밀번호 수정</div>
        <div class="dropdown-item logout-item" data-action="logout">로그아웃</div>
      </div>
    </div>

  </header>


  <!-- 메인 컨텐츠 -->
  <main>

    <!-- 새 비밀번호 -->
    <div class="form-group">
      <label>새 비밀번호</label>
      <input 
        id="passwordInput"
        type="password"
        placeholder="새 비밀번호 입력"
      />
      <small id="passwordError" class="error fixed-space hidden"></small>
    </div>

    <!-- 비밀번호 확인 -->
    <div class="form-group">
      <label>비밀번호 확인</label>
      <input 
        id="passwordCheckInput"
        type="password"
        placeholder="비밀번호 다시 입력"
      />
      <small id="passwordCheckError" class="error fixed-space hidden"></small>
    </div>

    <!-- 수정 버튼 -->
    <button 
      id="updateBtn"
      class="update-btn"
      disabled
    >
      수정하기
    </button>

  </main>

  <!-- 토스트 메시지 -->
  <div id="toast" class="toast hidden">비밀번호가 변경되었습니다!</div>

  <!-- 스크립트 -->
  <script src="/common/header.js"></script>
  <script src="script.js"></script>

</body>
</html>
